name: experiment-dirlink

on:
  push:
    branches: [experiment/junction-removeall]

permissions:
  contents: read

jobs:
  dirlink:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.24', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go test -count=1 -v ./experiments/...
